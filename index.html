<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>APNA AI</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #0b0d17; color: #ffffff; display: flex; flex-direction: column; height: 100vh; }
    header { background: #131728; padding: 15px 20px; border-bottom: 1px solid #232942; display: flex; align-items: center; justify-content: space-between; }
    h1 { font-size: 20px; color: #8b5cf6; }
    .container { flex: 1; display: flex; flex-direction: column; max-width: 800px; width: 100%; margin: 0 auto; padding: 20px; }
    
    /* Home View */
    #home-view { display: flex; flex-direction: column; gap: 20px; text-align: center; justify-content: center; height: 100%; }
    .hero { background: linear-gradient(135deg, #1e1b4b, #31104b); padding: 30px; border-radius: 16px; border: 1px solid #3b2d54; }
    .hero h2 { font-size: 26px; margin-bottom: 10px; }
    .hero p { color: #a78bfa; font-size: 14px; margin-bottom: 20px; }
    .btn-main { background: #7c3aed; color: #fff; padding: 12px 24px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 16px; }
    
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
    .card { background: #131728; border: 1px solid #232942; border-radius: 12px; padding: 20px; text-align: left; cursor: pointer; transition: 0.2s; }
    .card:hover { border-color: #7c3aed; background: #1c2138; }
    .card h3 { font-size: 16px; margin-bottom: 5px; color: #e2e8f0; }
    .card p { font-size: 12px; color: #94a3b8; }

    /* Chat View */
    #chat-view { display: none; flex-direction: column; height: 100%; }
    .chat-box { flex: 1; overflow-y: auto; background: #131728; border: 1px solid #232942; border-radius: 12px; padding: 15px; display: flex; flex-direction: column; gap: 12px; margin-bottom: 15px; }
    .msg { max-width: 80%; padding: 10px 14px; border-radius: 10px; font-size: 14px; line-height: 1.4; word-wrap: break-word; }
    .msg.user { background: #7c3aed; color: white; align-self: flex-end; }
    .msg.ai { background: #232942; color: #e2e8f0; align-self: flex-start; }
    
    .input-area { display: flex; gap: 10px; }
    input[type="text"] { flex: 1; background: #131728; border: 1px solid #232942; border-radius: 8px; padding: 12px; color: white; outline: none; font-size: 14px; }
    input[type="text"]:focus { border-color: #7c3aed; }
    .btn-send { background: #7c3aed; border: none; color: white; padding: 0 20px; border-radius: 8px; font-weight: bold; cursor: pointer; }
    .back-btn { background: transparent; border: 1px solid #3b2d54; color: #a78bfa; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 12px; margin-bottom: 10px; align-self: flex-start; }
  </style>
</head>
<body>

  <header>
    <h1>✨ APNA AI</h1>
  </header>

  <div class="container">
    <!-- Home View -->
    <div id="home-view">
      <div class="hero">
        <h2>Start with APNA AI</h2>
        <p>Your creative workspace powered by Gemini API</p>
        <button class="btn-main" onclick="openChat()">Start Chatting →</button>
      </div>

      <div class="grid">
        <div class="card" onclick="openChat()">
          <h3>💬 AI Chat</h3>
          <p>Brainstorm ideas & write prompts.</p>
        </div>
        <div class="card" onclick="alert('Image Studio coming soon!')">
          <h3>🖼️ Image Studio</h3>
          <p>Prepare prompts for AI images.</p>
        </div>
      </div>
    </div>

    <!-- Chat View -->
    <div id="chat-view">
      <button class="back-btn" onclick="openHome()">← Back to Home</button>
      <div class="chat-box" id="chatBox">
        <div class="msg ai">Hello! Main APNA AI hoon. Kaise help kar sakta hoon aapki?</div>
      </div>
      <div class="input-area">
        <input type="text" id="userInput" placeholder="Type your message here..." onkeypress="handleKey(event)">
        <button class="btn-send" onclick="sendMessage()">Send</button>
      </div>
    </div>
  </div>

  <script>
    function openChat() {
      document.getElementById('home-view').style.display = 'none';
      document.getElementById('chat-view').style.display = 'flex';
    }

    function openHome() {
      document.getElementById('chat-view').style.display = 'none';
      document.getElementById('home-view').style.display = 'flex';
    }

    function handleKey(e) {
      if (e.key === 'Enter') sendMessage();
    }

    async function sendMessage() {
      const input = document.getElementById('userInput');
      const text = input.value.trim();
      if (!text) return;

      const chatBox = document.getElementById('chatBox');

      // Add user message
      const userMsg = document.createElement('div');
      userMsg.className = 'msg user';
      userMsg.textContent = text;
      chatBox.appendChild(userMsg);

      input.value = '';
      chatBox.scrollTop = chatBox.scrollHeight;

      // Add AI Loading Message
      const aiMsg = document.createElement('div');
      aiMsg.className = 'msg ai';
      aiMsg.textContent = 'Thinking...';
      chatBox.appendChild(aiMsg);
      chatBox.scrollTop = chatBox.scrollHeight;

      try {
        const response = await fetch('/.netlify/functions/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: text })
        });
        const data = await response.json();
        aiMsg.textContent = data.reply || "Sorry, response parse nahi ho paya.";
      } catch (err) {
        aiMsg.textContent = "Error: Answer nahi mila. Key check karein.";
      }

      chatBox.scrollTop = chatBox.scrollHeight;
    }
  </script>
</body>
</html>
